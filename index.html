<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" />
</head>

<body>
  <div class="container">
    <header class="site-header">
      <img
        src="img/nasa-worm-logo.png"
        alt="NASA Logo"
        class="logo"
      />
      <h1>Space Explorer</h1>
    </header>

    <form id="dateForm" class="filters">
      <label for="startDate">
        Start date
        <input type="date" id="startDate" required />
      </label>

      <label for="endDate">
        End date
        <input type="date" id="endDate" required />
      </label>

      <button type="submit" id="getImages">
        Get Space Images
      </button>
    </form>

    <section class="space-fact">
      <h2>Did You Know?</h2>
      <p id="spaceFact"></p>
    </section>

    <p id="status" role="status" aria-live="polite"></p>

    <div id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>
          Select a date range and click "Get Space Images"
          to explore the cosmos!
        </p>
      </div>
    </div>

    <footer>
      Student project using NASA's Astronomy Picture of the Day API.
    </footer>
  </div>

  <!-- Native dialog supports keyboard focus and Escape to close. -->
  <dialog id="imageModal" aria-labelledby="modalTitle">
    <div class="modal-content">
      <button
        type="button"
        id="closeModal"
        class="close-modal"
        aria-label="Close details"
        autofocus
      >
        ✕
      </button>

      <h2 id="modalTitle"></h2>
      <p id="modalDate"></p>

      <div id="modalMedia"></div>

      <p id="modalExplanation"></p>
      <p id="modalCredit"></p>
    </div>
  </dialog>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
